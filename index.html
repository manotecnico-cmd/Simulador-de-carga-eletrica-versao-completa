<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pré-Dimensionador Infinita</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
.container { background:white; padding:20px; max-width:1200px; margin:auto; border-radius:10px; }
table { width:100%; border-collapse: collapse; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
th { background:#eee; }
input, select { width:100%; }
button { margin-top:10px; padding:10px; }
.result { margin-top:20px; background:#eee; padding:15px; }
</style>

</head>
<body>

<div class="container">

<h2 style="margin-bottom:2px;">
  Infinita Geradores
</h2>

<h3 style="margin:0; font-weight:normal;">
  Assessoria - Manutenção - Locação - Vendas
</h3>

<p style="margin-top:6px; margin-bottom:10px;">
  Dimensionador para determinação de potência
</p>

<label>Cenário:</label>
<select id="cenario">
<option value="leve">Residencial / Leve</option>
<option value="evento">Evento</option>
<option value="comercial">Comercial</option>
<option value="critico">Crítico – Hospital / Data Center / Centro Cirúrgico</option>
</select>

<h3>Dados do Cliente</h3>

<input id="cliente" placeholder="Nome do cliente"><br><br>
<input id="local" placeholder="Local / Obra"><br><br>
<input id="data" type="date"><br><br>

<table id="tabela">
<thead>
<tr>
<th>Equipamento</th>
<th>Nome</th>
<th>kW</th>
<th>FP</th>
<th>Simult.</th>
<th>Partida</th>
<th>Tipo</th>
<th>Essencial</th>
<th>X</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="addLinha()">Adicionar Equipamento</button>
<button onclick="calcular()">Calcular</button>
<button onclick="gerarPDF()">Gerar PDF</button>

<div class="result" id="resultado"></div>

</div>

<script>

const base = {
"manual": {kw:"", fp:0.9, sim:1, partida:"direta", tipo:"-"},
"elevador": {kw:10, fp:0.85, sim:0.4, partida:"soft", tipo:"motor"},
"motor": {kw:"", fp:0.8, sim:1, partida:"direta", tipo:"motor"},
"portao": {kw:0.8, fp:0.8, sim:0.3, partida:"direta", tipo:"motor"},
"cftv": {kw:0.3, fp:0.95, sim:1, partida:"direta", tipo:"eletronica"},
"iluminacao": {kw:"", fp:0.9, sim:0.95, partida:"direta", tipo:"eletronica"},
"cozinha": {kw:30, fp:0.9, sim:0.8, partida:"soft", tipo:"mista"},
"audio": {kw:"", fp:0.92, sim:0.9, partida:"direta", tipo:"eletronica"},
"ar": {kw:"", fp:0.9, sim:0.9, partida:"soft", tipo:"mista"},
"outro": {kw:"", fp:"", sim:"", partida:"direta", tipo:""}
};

function fatorPartida(tipo){
if(tipo === "direta") return 3;
if(tipo === "soft") return 2;
if(tipo === "inversor") return 1.2;
return 1;
}

function addLinha(){
let t = document.querySelector("#tabela tbody");
let r = t.insertRow();

r.innerHTML = `
<td>
<select onchange="preencher(this)">
<option value="manual">Manual</option>
<option value="elevador">Elevador</option>
<option value="motor">Motor</option>
<option value="portao">Portão</option>
<option value="cftv">CFTV</option>
<option value="iluminacao">Iluminação</option>
<option value="cozinha">Cozinha</option>
<option value="audio">Áudio</option>
<option value="ar">Ar-condicionado</option>
<option value="outro">Outro</option>
</select>
</td>
<td><input></td>
<td><input type="number"></td>
<td><input type="number" step="0.01"></td>
<td><input type="number" step="0.01"></td>

<td>
<select>
<option value="direta">Direta</option>
<option value="soft">Soft-starter</option>
<option value="inversor">Inversor</option>
</select>
</td>

<td><input></td>
<td><input type="checkbox"></td>
<td><button onclick="this.parentNode.parentNode.remove()">X</button></td>
`;
}

function preencher(sel){
let r = sel.parentNode.parentNode;
let d = base[sel.value];
if(sel.value === "outro") return;

r.cells[2].children[0].value = d.kw;
r.cells[3].children[0].value = d.fp;
r.cells[4].children[0].value = d.sim;
r.cells[5].children[0].value = d.partida;
r.cells[6].children[0].value = d.tipo;
}

function calcular(){


let rows = document.querySelectorAll("#tabela tbody tr");

let total = processar(rows, false);
let essencial = processar(rows, true);

let cenario = document.getElementById("cenario").value;

let aviso = "";
if(essencial.somaKw === 0){
aviso = "<br><b>⚠ Nenhuma carga essencial definida</b><br>";
}

let redundancia = "";
if(cenario === "critico"){
redundancia = "<br><b>Recomendação: Sistema N+1 (redundância)</b>";
}

document.getElementById("resultado").innerHTML = `

<h3>Resultado ESSENCIAL</h3>
<b>kW base:</b> ${essencial.kwBase.toFixed(1)}<br>
<b>Pico motor:</b> ${essencial.pico.toFixed(1)}<br>
<b>Margem aplicada:</b> ${(essencial.margem*100-100).toFixed(0)}%<br>
<b>kW final:</b> ${essencial.kwFinal.toFixed(1)}<br>
<b>FP médio:</b> ${essencial.fpMedio.toFixed(2)}<br>
<b>Gerador mínimo:</b> ${essencial.kva} kVA<br>

<br>
<b>Confiança (Essencial):</b> ${essencial.confianca}<br>
<b>Avisos:</b><br>
${essencial.avisos.length ? essencial.avisos.join("<br>") : "Nenhum"}

<hr>

<h3>Resultado TOTAL</h3>
<b>kW base:</b> ${total.kwBase.toFixed(1)}<br>
<b>Pico motor:</b> ${total.pico.toFixed(1)}<br>
<b>Margem aplicada:</b> ${(total.margem*100-100).toFixed(0)}%<br>
<b>kW final:</b> ${total.kwFinal.toFixed(1)}<br>
<b>FP médio:</b> ${total.fpMedio.toFixed(2)}<br>
<b>Gerador ideal:</b> ${total.kva} kVA<br>

<br>
<b>Confiança (Total):</b> ${total.confianca}<br>
<b>Avisos:</b><br>
${total.avisos.length ? total.avisos.join("<br>") : "Nenhum"}

${aviso}
${redundancia}

`;

}

function processar(rows, apenasEssencial){

let avisos = [];
let confianca = "Alta";

let kwBase = 0;
let maiorMotor = 0;
let maiorFator = 1;
let somaKw = 0;
let somaFP = 0;

rows.forEach(r => {

let essencial = r.cells[7].children[0].checked;
if(apenasEssencial && !essencial) return;

let kw = parseFloat(r.cells[2].children[0].value) || 0;
let fp = parseFloat(r.cells[3].children[0].value) || 0;
let sim = parseFloat(r.cells[4].children[0].value) || 1;
let partidaTipo = r.cells[5].children[0].value;
let tipo = r.cells[6].children[0].value;
let nome = r.cells[1].children[0].value || "Equipamento não identificado";

if(r.cells[0].children[0].value === "audio" && kw === 0){
avisos.push("Áudio sem potência definida — usar rider técnico");
confianca = "Baixa";
}
else if(kw === 0){
avisos.push(`Potência não definida: ${nome}`);
confianca = "Baixa";
}

if(tipo === "motor" && kw > 50){
if(!avisos.some(a => a.includes("Motor de grande porte"))){
avisos.push("Motor de grande porte detectado — verificar tipo de partida");
}
}



let fator = fatorPartida(partidaTipo);

let kwSim = kw * sim;

if(tipo === "eletronica" && r.cells[0].children[0].value === "audio"){
kwSim += kw * 0.15;
}

kwBase += kwSim;

if(tipo === "motor" && kw > maiorMotor){
maiorMotor = kw;
maiorFator = fator;
}

somaKw += kw;
somaFP += kw * fp;

});

let pico = maiorMotor * (maiorFator - 1);

let cenario = document.getElementById("cenario").value;
let margem = 1.3;
if(cenario === "evento") margem = 1.4;
if(cenario === "critico") margem = 1.6;
if(cenario === "leve") margem = 1.25;

let kwFinal = (kwBase * margem) + pico;
let fpMedio = somaKw ? somaFP / somaKw : 1;
if(fpMedio < 0.75){
avisos.push("Fator de potência baixo — avaliar correção");
if(confianca !== "Baixa"){
confianca = "Média";
}
}
let kva = fpMedio ? kwFinal / fpMedio : 0;

kva = Math.ceil(kva / 5) * 5;

return {
kwBase,
kwFinal,
kva,
somaKw,
pico,
margem,
fpMedio,
avisos,
confianca
};

}
